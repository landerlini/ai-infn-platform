apiVersion: v1
kind: PersistentVolume
metadata:
  name: jhub-sqlite
  namespace: {{ .Values.jhubNamespace }}
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: local-storage
  local:
    path: {{ .Values.jhubDatabaseLocalPath }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists


{{ if .Values.jhubCVMFSpvc }}
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.jhubCVMFSpvc  }}
  namespace: {{ .Values.jhubNamespace }}
spec:
  accessModes:
  - ReadOnlyMany
  resources:
    requests:
      # Volume size value has no effect and is ignored
      # by the driver, but must be non-zero.
      storage: 1
  storageClassName: cvmfs

{{ end }}



