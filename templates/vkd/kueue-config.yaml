
{{ range .Values.acceleratorKnownModels }}
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  {{ if get . "type" -}}
  name: {{ get . "type" -}}-{{- get . "short_name" -}}
  {{ else -}}
  name: {{ get . "short_name" -}}
  {{- end }} 
spec:
  nodeLabels:
    {{- pick . "node_selector" | values | first | toYaml | nindent 4 }}
  nodeTaints: 
  {{- range $key, $value := .node_selector }}
    - key: {{ $key }}
      value: {{ $value }}
      effect: NoSchedule
  {{- end }}
---
{{ end }}

---

{{ if .Values.interlinkEnabled }}

apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: interlink

spec:
  nodeLabels:
    type: virtual-kubelet

  nodeTaints: 
    - key: "virtual-node.interlink/no-schedule"
      value: "true"
      effect: NoSchedule

  tolerations:
    - key:  "virtual-node.interlink/no-schedule"
      operator: "Exists"
      effect: NoSchedule

---

apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: "offloading"
spec:
  namespaceSelector: {} # match all.
  cohort: {{ .Release.Name }}
  resourceGroups:
  - coveredResources: ["cpu", "memory", "nvidia.com/gpu", 'amd.com/xilinx_u55c_gen3x16_xdma_base_3-0']
    flavors:
      - name: interlink
        resources:
          - name: cpu
            nominalQuota: 8
          - name: memory
            nominalQuota: 16Gi
          - name: "nvidia.com/gpu"
            nominalQuota: 0
            borrowingLimit: 0
          - name: "amd.com/xilinx_u55c_gen3x16_xdma_base_3-0"
            nominalQuota: 0
            borrowingLimit: 0

--- 
{{ end }} 

apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: "queue-template"
spec:
  namespaceSelector: {} # match all.
  cohort: {{ .Release.Name }}
  resourceGroups:
  - coveredResources: ["cpu", "memory", "nvidia.com/gpu", 'amd.com/xilinx_u55c_gen3x16_xdma_base_3-0']
    flavors:
    {{ range .Values.acceleratorKnownModels }}
    - {{ if get . "type" -}}
      name: {{ get . "type" -}}-{{- get . "short_name" -}}
      {{ else -}}
      name: {{ get . "short_name" -}}
      {{- end }} 
      resources:
      - name: "cpu"
        nominalQuota: 0
        borrowingLimit: 0
      - name: "memory"
        nominalQuota: 0
        borrowingLimit: 0
      - name: "amd.com/xilinx_u55c_gen3x16_xdma_base_3-0"
        nominalQuota: 0
        borrowingLimit: 0

    {{ end }}
