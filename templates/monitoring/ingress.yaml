apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-prometheus-basic-auth
  namespace: monitoring
type: Opaque
data:
  auth: {{ .Values.prometheusBasicAuth | b64enc }}


--- 

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-monitoring
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: lets-issuer
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ .Release.Name }}-prometheus-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
spec:
  ingressClassName: nginx
  rules:
  - host: hub.ai.cloud.infn.it
    http:
      paths:
      - backend:
          service:
            name: prometheus-stack-kube-prom-prometheus
            port:
              name: http-web
        path: /prometheus(/|$)(.*)
        pathType: ImplementationSpecific

