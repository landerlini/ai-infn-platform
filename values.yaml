hostname: 
nfsServerAddress: 123.56.78.90

################################################################################
## Monitoring (templates/monitoring/*.yaml)

# To be generated with: `openssl rand -hex 32`
jhubMetricApiKey:

# Local path of the database
jhubDatabaseLocalPath: /data/aiinfn/jhub/db

# Version of the Jupyter hub helm chart as from https://hub.jupyter.org/helm-chart/
jhubChartVersion: 4.3.1

# Namespace where to install the interactive part of the JupyterHub
jhubNamespace: jhub

# Service account of jupyter hub
jhubServiceAccount: hub

# To be generated with: `openssl rand -hex 32`
jhubProxySecretToken: 
 
# To be generated with: `openssl rand -hex 32`
jhubCookieSecret: 

# To be generated with: `openssl rand -hex 32`
jhubCryptKey:

jhubCVMFSpvc: cvmfs-jhub

################################################################################
# Grafana (templates/monitoring/grafana.yaml)
#
grafanaNfsPath: /grafana
vkdGitBranch: jfs
  
# To be generated with: `openssl rand -hex 32`
postgresPassword: 


# To be defined in values.yaml
grafanaAdminPassword:

grafanaServerDomain: infn.it

################################################################################
## Custom allocation monitoring (templates/monitoring/ext-resource-exporter.yaml)

# jhubExtResAllocExporterEnabled enables a custom prometheus exporter for gpu allocation
jhubExtResAllocExporterEnabled: true
  
# jhubCustomExporterImage defines the image used for the custom exporter
jhubCustomExporterImage: "harbor.cloud.infn.it/testbed-dm/python-prometheus-exporter:0.1-pre18"

# jhubExtResAllocExporterNamespaces list the namespaces monitored for allocated resources
jhubExtResAllocExporterNamespaces:
  - default
  - vkd
  - jhub

# jhubExtResAllocExporterExtendedResources list extended resources to track
jhubExtResAllocExporterExtendedResources:
  - "nvidia.com/gpu"
  - "nvidia.com/mig-1g.10gb"
  - "nvidia.com/mig-2g.20gb"
  - "nvidia.com/mig-3g.30gb"
  - "nvidia.com/mig-4g.40gb"
  - "nvidia.com/mig-1g.5gb"
  - "nvidia.com/mig-2g.10gb"
  - "nvidia.com/mig-3g.15gb"
  - "nvidia.com/mig-4g.20gb"

# jhubExtResAllocExporterDebug enables verbose messages in the stdout log of the exporter
jhubExtResAllocExporterDebug: no

# jhubExtResAllocExporterNodeLabelForModel defines the node label to identify the accelerator model
jhubExtResAllocExporterNodeLabelForModel: "nvidia.com/gpu.product"
  

################################################################################
## BastionSSH configuration
## ------------------------

# bastionImage is the docker image of the bastion pod (main container)
bastionImage: "landerlini/bastion:v0.1a"

# bastionPort is the *internal* port to configure the sshd server
bastionPort: 22

# bastionNodePort is the *external* nodePort to configure the bastion service.
# It is the port used to access the bastion from outside.
bastionNodePort: 30022

# bastionAdminPublicKey is the public RSA key of an administrator 
bastionAdminPublicKey: 


################################################################################
## NFS metric config
## ------------------------

# nfsMetricsPort define the port for the metrics on disk occupancy
nfsMetricsPort: 9400

# nfsMetricsPath define the query path to access the NFS server metrics
nfsMetricsPath: "/metrics"

################################################################################
# JupyterHub configuration
OAuthName: INFN Cloud
OAuthEndpoint: https://iam.cloud.infn.it
IamClientId:
IamClientSecret: 
jhubOAuthGroups: users/ai-infn
jhubAdminGroups: admins/ai-infn
jhubStartTimeout: 120
grafanaOAuthGroups: users/ai-infn
grafanaAdminGroups: admins/ai-infn
nfsMountPoint: "/nfs-shared"
jhubEnvsSetup: "/envs/setup.sh"

jhubDebug: "yes"

jhubHomeName: "home"
sshPort: 22
jhubDefaultSplashMessage: "Welcome to the AI_INFN Hackathon in Pavia!"
jhubDefaultJLabImages: 
  AI_INFN Platform: "harbor.cloud.infn.it/unpacked/jlab-ai-infn:2.0.0-ai1.4"

jhubSystemVolumes: 
  - "vkd"
  - "www"

# vkdPrivateKey is the SSH key to GitOps landerlini/vk-dispatcher (deploy key)
vkdPrivateKey:

